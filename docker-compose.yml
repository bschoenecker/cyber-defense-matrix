services:
  cdm:
    build: .
    ports:
      - "3001:3000"
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: "file:/app/data/cdm.db"
      NEXTAUTH_SECRET: "change-me-generate-with-openssl-rand-base64-32"
      NEXTAUTH_URL: "http://localhost:3001"
    restart: unless-stopped
